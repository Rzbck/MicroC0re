name: Godot Smoke

on:
  push:
    branches:
      - main
      - rebuild/pixel-microscope-v0.2
    paths:
      - "project.godot"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/headless.yml"
  pull_request:
    paths:
      - "project.godot"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/headless.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: microcore-godot-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Godot 4.7.1 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Show Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Check simulation parser directly
        run: godot --headless --path . --script src/simulation/petri_simulation.gd --check-only

      - name: Check pixel-isometric renderer parser directly
        run: godot --headless --path . --script src/app/pixel_isometric_world.gd --check-only

      - name: Run deterministic smoke test
        shell: pwsh
        run: ./scripts/run_headless.ps1

      - name: Run 5k CPU scale benchmark
        shell: pwsh
        run: |
          $output = & godot --headless --path . --script tests/perf_benchmark.gd 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $lines = @($output | Where-Object { $_ -match '^population=' })
          $body = @(
            ('### CI scale benchmark ' + $env:GITHUB_SHA)
            ''
            'Living-world CPU benchmark (core simulation + living terrain):'
            ''
            '```text'
          )
          $body += $lines
          $body += '```'
          $body | Set-Content -Path perf-benchmark.md -Encoding utf8
          if ($code -ne 0) {
            exit $code
          }

      - name: Publish scale benchmark to issue 67
        if: github.event_name == 'push' && github.ref == 'refs/heads/rebuild/pixel-microscope-v0.2'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 67 --body-file perf-benchmark.md
